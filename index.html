<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample HTML Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
      background: #f7f7f7;
      color: #222;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #1f4e79;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #1f4e79;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #163a5c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to My Sample HTML Page</h1>
    <p>This is a simple HTML file containing a heading, paragraph, list, link, and button.</p>

    <h2>Sample List</h2>
    <ul>
      <li>HTML structure</li>
      <li>Basic CSS styling</li>
      <li>Simple JavaScript interaction</li>
    </ul>

    <p>
      Visit
      <a href="https://www.example.com" target="_blank">Example.com</a>
      for a sample external link.
    </p>

    <button onclick="showMessage()">Click Me</button>
    <p id="message"></p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").textContent = "Hello! The button works.";
    }
  </script>
</body>
</html>
